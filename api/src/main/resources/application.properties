spring.application.name=api

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/helpdeskX-db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/data.sql

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyaway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true

#Security
application.security.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=3600000
# Refresh token lifetime (ms). Each refresh issues a new token, so an active user keeps rolling forward.
application.security.jwt.refresh-expiration=86400000
# Hard cap on a session (ms), counted from login. Refreshing never extends it, so the user must log in
# again after this. 30 days.
application.security.jwt.session-lifetime=2592000000
# Comma-separated list of browser origins allowed to call the API
application.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Auth flows (register / verify email / forgot + reset password)
application.auth.default-role=${AUTH_DEFAULT_ROLE:requester}
application.auth.verification-token-ttl=24h
application.auth.password-reset-token-ttl=30m
# Links in emails point here, e.g. http://localhost:3000/reset-password?token=...
application.auth.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3000}
application.auth.mail-from=${MAIL_FROM:no-reply@helpdeskx.local}

# Mail. Defaults target a local Mailpit/MailHog (SMTP :1025, web UI :8025).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# Logging Configuration
logging.level.root=warn
logging.level.org.springframework.web=debug
logging.level.org.hibernate=error